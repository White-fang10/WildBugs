<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c17"/>
      <stop offset="50%" stop-color="#19241e"/>
      <stop offset="100%" stop-color="#0d1410"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2e4235" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Center Ambient Glow -->
  <circle cx="400" cy="210" r="180" fill="url(#glowGrad)"/>

  <!-- Stylized Bug Badge Graphic -->
  <g transform="translate(350, 140)">
    <!-- Bug Body -->
    <ellipse cx="50" cy="75" rx="36" ry="42" fill="#388E3C"/>
    <ellipse cx="40" cy="62" rx="12" ry="16" fill="rgba(255,255,255,0.15)"/>
    <!-- Head -->
    <ellipse cx="50" cy="36" rx="25" ry="22" fill="#4CAF50"/>
    <!-- Eyes -->
    <circle cx="40" cy="34" r="8" fill="#ffffff"/>
    <circle cx="60" cy="34" r="8" fill="#ffffff"/>
    <circle cx="42" cy="34" r="4.5" fill="#111111"/>
    <circle cx="62" cy="34" r="4.5" fill="#111111"/>
    <circle cx="44" cy="32" r="2" fill="#ffffff"/>
    <circle cx="64" cy="32" r="2" fill="#ffffff"/>
    <!-- Antennae -->
    <path d="M40 18 Q30 4 22 8" stroke="#81C784" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="21" cy="9" r="3.5" fill="#A5D6A7"/>
    <path d="M60 18 Q70 4 78 8" stroke="#81C784" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="79" cy="9" r="3.5" fill="#A5D6A7"/>
    <!-- Cute Smile -->
    <path d="M44 44 Q50 50 56 44" stroke="#1B5E20" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Small Wings -->
    <ellipse cx="20" cy="72" rx="16" ry="7" fill="rgba(165,214,167,0.35)" stroke="#4CAF50" stroke-width="1" transform="rotate(-25 20 72)"/>
    <ellipse cx="80" cy="72" rx="16" ry="7" fill="rgba(165,214,167,0.35)" stroke="#4CAF50" stroke-width="1" transform="rotate(25 80 72)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="295" text-anchor="middle" fill="#E8F5E9" font-family="'Montserrat', -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="1">WILD BUGS</text>
  <text x="400" y="325" text-anchor="middle" fill="#81C784" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="13" letter-spacing="2">PROJECT PREVIEW</text>
</svg>
